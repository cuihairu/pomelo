# Nightly: build the image, really boot it in QEMU, publish the evidence.
#
# The release is rolling: the `nightly` tag is deleted and recreated each
# run, so there is exactly one nightly release at any time. Everything it
# ships (iso, kernel, disk image, serial logs, boot screenshots) is rebuilt
# from that day's main; nothing is cached between runs.
#
# Both machines run every time: `pc` has legacy IDE so ls/cat work; `q35`
# wires its disk through AHCI and the fs service parks with a note. Both
# outcomes are green; a hang is not. The release job waits for both legs
# and publishes only if every check passed.

name: nightly

on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
    inputs:
      qemu_extra:
        description: extra qemu args, e.g. "-d int" to watch interrupts
        required: false
        default: ''

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [q35, pc]
    steps:
      - uses: actions/checkout@v4

      - name: install qemu and iso tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              qemu-system-x86 grub-pc-bin xorriso mtools socat imagemagick

      - name: build kernel, image and iso
        run: |
          cmake -S . -B build
          cmake --build build -j
          cmake --build build --target iso

      - name: smoke test
        working-directory: build
        run: ctest --output-on-failure

      - name: boot in qemu and collect evidence
        run: |
          sh tools/nightly-run.sh qemu-system-x86_64 "${{ matrix.machine }}" \
              build/kernel build/pomelo.img \
              "nightly-output-${{ matrix.machine }}" \
              ${{ inputs.qemu_extra }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.machine }}
          path: |
            nightly-output-${{ matrix.machine }}/serial.log
            nightly-output-${{ matrix.machine }}/boot.png
            build/pomelo.iso
            build/kernel
            build/pomelo.img
          retention-days: 14

  release:
    needs: nightly
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download the evidence from both machines
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: artifacts

      - name: refresh the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date=$(date -u +%F)
          short=${GITHUB_SHA:0:7}
          cat > nightly-notes.md <<EOF
          booted in qemu on both machines at commit $short.

          try it:
              qemu-system-i386 -M pc -kernel kernel -hda pomelo.img -serial stdio

          q35 note: the disk sits behind ahci, so the fs service parks with
          a no-disk note; pick -M pc for the full disk battery.
          EOF
          gh release delete nightly --yes --cleanup-tag || true
          # both machines ship serial.log/boot.png; rename them per machine or
          # the parallel upload 422s on the second asset with the same name
          mv artifacts/nightly-q35/nightly-output-q35/serial.log \
             artifacts/nightly-q35/nightly-output-q35/serial-q35.log
          mv artifacts/nightly-q35/nightly-output-q35/boot.png \
             artifacts/nightly-q35/nightly-output-q35/boot-q35.png
          mv artifacts/nightly-pc/nightly-output-pc/serial.log \
             artifacts/nightly-pc/nightly-output-pc/serial-pc.log
          mv artifacts/nightly-pc/nightly-output-pc/boot.png \
             artifacts/nightly-pc/nightly-output-pc/boot-pc.png
          gh release create nightly \
              --title "nightly $date" \
              --notes-file nightly-notes.md \
              artifacts/nightly-q35/build/pomelo.iso \
              artifacts/nightly-q35/build/kernel \
              artifacts/nightly-q35/build/pomelo.img \
              artifacts/nightly-q35/nightly-output-q35/serial-q35.log \
              artifacts/nightly-q35/nightly-output-q35/boot-q35.png \
              artifacts/nightly-pc/nightly-output-pc/serial-pc.log \
              artifacts/nightly-pc/nightly-output-pc/boot-pc.png
